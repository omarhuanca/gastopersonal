<?xml version="1.0" encoding="UTF-8"?>
<!-- Google Play icon source. Same geometry and colors as the app's adaptive icon
     (res/drawable/ic_launcher_background.xml + ic_launcher_foreground.xml), as a full square:
     Play applies its own rounded mask. Regenerate the PNG with:
     rsvg-convert -w 512 -h 512 play-store/icon.svg -o play-store/icon-512.png, then save it as RGBA
     (Play wants a 32-bit PNG): python3 -c "from PIL import Image; Image.open('play-store/icon-512.png').convert('RGBA').save('play-store/icon-512.png')" -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 108 108">
  <defs>
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="108" y2="108">
      <stop offset="0" stop-color="#43A047"/>
      <stop offset="1" stop-color="#1B5E20"/>
    </linearGradient>
  </defs>

  <rect width="108" height="108" fill="url(#bg)"/>

  <!-- Coin -->
  <path fill="#FFC857" d="M47,38a11,11 0 1 0 22,0a11,11 0 1 0 -22,0z"/>
  <path fill="none" stroke="#E0A526" stroke-width="1.6" d="M51.5,38a6.5,6.5 0 1 0 13,0a6.5,6.5 0 1 0 -13,0z"/>

  <!-- Wallet; the clasp is a hole with a dot inside it -->
  <path fill="#FFFFFF" fill-rule="evenodd" d="M33,42h42a6,6 0 0 1 6,6v22a6,6 0 0 1 -6,6h-42a6,6 0 0 1 -6,-6v-22a6,6 0 0 1 6,-6z M64,53h11a5,5 0 0 1 0,10h-11a5,5 0 0 1 0,-10z M72,58a2,2 0 1 0 4,0a2,2 0 1 0 -4,0z"/>
</svg>
